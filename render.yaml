# SecureApp — Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  # ── Backend: FastAPI Web Service ──────────────────────────
  - type: web
    name: secureapp-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://secureapp-algothon26-1.onrender.com
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.6"

  # ── Frontend: React Static Site ──────────────────────────
  - type: web
    name: secureapp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://secureapp-algothon26.onrender.com
